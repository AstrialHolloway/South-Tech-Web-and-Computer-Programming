<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="olive.png">
    <title>Centered Olive</title>
    <style>
      html {
        /* Fixed spacing in the gradient */
        background-image: linear-gradient(to bottom, #655258, #907e7e);
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Target the image via CSS to safely use 'em' sizing */
      img {
        width: 5em; /* Adjusted to 5em so it's clearly visible, change as needed */
        height: auto;
      }
    </style>
  </head>
  <body>
    <!-- Removed the broken HTML width attribute -->
    <img src="olive.png" alt="cartoon olive">
  </body>
</html>
