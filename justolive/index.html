<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset=UTF-8">    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Centered Olive</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="olive.png">
    </head>
    <body>
        <div class="centered">
            <img id="olive" src="olive.png" alt="olive" onclick="explodeOlives()">
        </div>
        <footer style="position: absolute; bottom: 10px; width: 100%; text-align: center; color: #fff;">
            by Ashley | <a href="https://justbean.co/" target="_blank">Original</a> | <a href="../index.html">Home</a> 
        </footer>
        <script>
            function explodeOlives() {
                const container = document.querySelector('.centered');
                for (let i = 0; i < 10; i++) {
                    const newOlive = document.createElement('img');
                    newOlive.src = 'olive.png';
                    newOlive.style.position = 'absolute';
                    newOlive.style.width = '50px';
                    newOlive.style.height = '50px';
                    newOlive.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
                    newOlive.style.opacity = '0';

                    // Initial position at the center
                    newOlive.style.transform = 'translate(0, 0) scale(0.5)';

                    container.appendChild(newOlive);

                    // Random position around the original olive
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = Math.random() * 100 + 50;

                    // Trigger the animation
                    setTimeout(() => {
                        newOlive.style.opacity = '1';
                        newOlive.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(1)`;
                    }, 0);

                    // Remove the olive after animation
                    setTimeout(() => {
                        newOlive.style.opacity = '0';
                        setTimeout(() => {
                            container.removeChild(newOlive);
                        }, 1000);
                    }, 1000);
                }
            }
        </script>

    </body>
</html>
