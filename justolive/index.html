<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="olive.png">
    <title>Centered Olive</title>
    <style>
      html {
        background-image: linear-gradient(to bottom, #655258, #907e7e);
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative; /* Container boundary for absolute clones */
      }
      
      /* Main Olive Container */
      .olive-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      img.main-olive {
        width: 12em;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        z-index: 10; /* Ensures the master olive stays on top */
      }
      img.main-olive:hover {
        transform: scale(1.15) rotate(15deg); 
        cursor: pointer;
      }
      img.main-olive:active {
        transform: scale(0.95) rotate(-10deg);
      }

      /* Base Style for Spawning Clone Particles */
      .olive-clone {
        position: absolute;
        width: 12em; /* Keeps the particle sizes structurally identical */
        height: auto;
        pointer-events: none; /* Prevents clicks on clones from blocking interactions */
        z-index: 5;
        animation: explodeAndFade 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }

      /* Burst animation: moves to the custom CSS coordinates, scales, and handles visibility */
      @keyframes explodeAndFade {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 0;
        }
        15% {
          opacity: 0.8; /* Quick fade-in right near the main olive */
        }
        100% {
          /* Smoothly moves out to the randomly calculated target position assigned by JS */
          transform: translate(var(--x), var(--y)) scale(0.4);
          opacity: 0; /* Complete fade-out at completion */
        }
      }
    </style>
  </head>
  <body>

    <div class="olive-wrapper">
      <img src="olive.png" alt="cartoon olive" class="main-olive" id="interactive-olive">
    </div>

    <script>
      const mainOlive = document.getElementById('interactive-olive');
      const wrapper = document.querySelector('.olive-wrapper');
      
      function spawnCopies() {
        const copyCount = 10;
        
        for (let i = 0; i < copyCount; i++) {
          // Create duplicate image tags matching the source asset
          const clone = document.createElement('img');
          clone.src = mainOlive.src;
          clone.alt = "olive copy";
          clone.className = 'olive-clone';

          // Generate random flight trajectories moving away from the center
          // Multipliers represent max pixel distance horizontally and vertically
          const angle = Math.random() * Math.PI * 2;
          const distance = 150 + Math.random() * 200; // Flings particles outward between 150px and 350px
          
          const targetX = `${Math.cos(angle) * distance}px`;
          const targetY = `${Math.sin(angle) * distance}px`;

          // Inject coordinates into custom CSS variables for the animation to read
          clone.style.setProperty('--x', targetX);
          clone.style.setProperty('--y', targetY);

          // Append to the wrapping context
          wrapper.appendChild(clone);

          // Clean up DOM tree after the 800ms fade animation finishes
          setTimeout(() => {
            clone.remove();
          }, 800);
        }
      }

      // Trigger burst effect exactly like justbean.co on user click
      mainOlive.addEventListener('click', spawnCopies);
    </script>
  </body>
</html>
