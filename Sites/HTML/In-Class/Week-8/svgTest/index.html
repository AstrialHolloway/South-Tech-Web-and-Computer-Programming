	<body>
		<h1>SVG - Scalable Vector Graphics</h1>
		<!--
			cx = Center X
			cy = Center Y
			r = Radius
			stroke = Border Color
			stroke-width = Border Width
			fill = Inside Color
			x = First Point for rect
			y = First Point for rect
		-->
		<svg height ="110" width="500">
			<rect width="300" height="100" style="fill:rgb(0,0,255);stroke-width:3;stroke:rgb(0,0,0)" />
			<circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
			<circle cx="150" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
			<circle cx="250" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
			<line x1="200" y1="115" x2="300" y2="50" stroke="red" stroke-width="5" />
			Sorry, your browser does not support inline SVGs
		</svg>
		<br>
		<svg height ="200" width="200">
			<rect x="10" y="20" width="180" height="120" stoke="red" fill="blue"/>
			Sorry, your browser does not support inline SVGs
		</svg>
		<br>
		<svg height ="650" width="150">
			<circle cx="80" cy="70" r="40" stroke="green" stroke-width="7" fill="pink" />
			<circle cx="80" cy="370" r="40" stroke="red" stroke-width="7" fill="yellow" />
			Sorry, your browser does not support inline SVGs
		</svg>
