<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#030612">
	<title>Galactic Scrimmage</title>
	<style>
		:root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #030612; color: #e7faff; }
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body { background: radial-gradient(ellipse at 50% 78%, rgba(30,21,86,.62), transparent 46%), radial-gradient(ellipse at 12% 35%, rgba(7,61,93,.38), transparent 36%), #030612; }
		#battlefield { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
		.space-haze { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg,rgba(2,5,17,.15),transparent 25%,transparent 68%,rgba(3,5,17,.5)),radial-gradient(ellipse at 50% 54%,transparent 35%,rgba(2,5,16,.36)); }
		.hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
		.panel { position: absolute; min-width: 190px; padding: 11px 15px 12px; border: 1px solid rgba(77,222,255,.72); background: linear-gradient(135deg,rgba(4,22,38,.88),rgba(4,10,25,.72)); box-shadow: inset 0 0 18px rgba(25,181,255,.12),0 0 18px rgba(0,170,255,.16); color: #9af4ff; }
		.panel-label { display: block; margin-bottom: 5px; color: #54deff; font-size: .68rem; font-weight: 800; letter-spacing: .2em; }
		.panel-value { font: 700 clamp(1rem,1.8vw,1.45rem) Consolas,"Courier New",monospace; letter-spacing: .08em; }
		.score { top: 24px; left: 26px; min-width: 150px; color: #eaff71; border-color: rgba(224,255,92,.8); }
		.score .panel-label { color: #eaff71; }
		.vitals { position: absolute; top: 24px; right: 26px; display: grid; gap: 10px; width: min(230px,34vw); }
		.vital { padding: 9px 12px 10px; border: 1px solid rgba(85,255,159,.7); background: rgba(4,23,24,.82); color: #a7ffc6; font: 700 .68rem Consolas,"Courier New",monospace; letter-spacing: .12em; }
		.vital.shield { border-color: rgba(197,117,255,.76); background: rgba(23,9,36,.84); color: #e3c2ff; }
		.vital-heading { display: flex; justify-content: space-between; margin-bottom: 7px; }
		.meter { height: 7px; overflow: hidden; border: 1px solid currentColor; background: #0008; }
		.meter-fill { width: 84%; height: 100%; background: currentColor; }
		.shield .meter-fill { width: 98%; }
		.radar { position: absolute; top: 156px; right: 26px; width: 170px; height: 170px; overflow: hidden; border: 2px solid #b55cff; border-radius: 50%; background: radial-gradient(circle,transparent 0 24%,rgba(196,91,255,.38) 24.5% 25%,transparent 25.5% 49%,rgba(196,91,255,.38) 49.5% 50%,transparent 50.5% 74%,rgba(196,91,255,.38) 74.5% 75%,transparent 75.5%),radial-gradient(circle,rgba(63,12,85,.76),rgba(7,5,25,.91)); box-shadow: inset 0 0 24px #cd57ff3d,0 0 18px #c03fff61; }
		.radar-title { position: absolute; top: 133px; right: 26px; color: #e8c1ff; font: 700 .62rem Consolas,monospace; letter-spacing: .16em; }
		.radar-sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg,transparent 0 300deg,#51ffa108 325deg,#51ffa166); animation: sweep 4s linear infinite; }
		.blip { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #59ff9d; box-shadow: 0 0 8px 2px #59ff9d; animation: blink 1.5s ease-in-out infinite alternate; }
		.blip.one { top:31%;left:31%; } .blip.two { top:62%;left:74%;animation-delay:.5s; } .blip.three { top:75%;left:43%;animation-delay:.9s; } .blip.hostile { top:45%;left:63%;background:#ff526d;box-shadow:0 0 8px 2px #ff526d; }
		.obama-track { position:absolute;display:none;width:8px;height:8px;border:1px solid #fff3ad;border-radius:50%;background:#ffe66d;box-shadow:0 0 5px 2px #ffe66d;transform:translate(-50%,-50%); }
		.obama-track.is-active { display:block; }
		.obama-track span { position:absolute;top:50%;left:calc(100% + 5px);transform:translateY(-50%);padding:2px 3px;background:#0f0d1ee6;color:#fff3ad;font:800 .5rem Consolas,monospace;white-space:nowrap; }
		.weapon { bottom:26px;left:26px;min-width:240px; }
		.weapon .panel-value { font-size:1rem; }
		.overheat { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 20px;border:2px solid #ff514b;background:#26040ac2;color:#ff7368;font:900 clamp(.9rem,2vw,1.35rem) Consolas,monospace;letter-spacing:.18em;animation:pulse .9s ease-in-out infinite alternate;white-space:nowrap; }
		.ship { position:absolute;bottom:-1vh;left:50%;width:clamp(125px,18vw,230px);transform:translateX(-50%);filter:drop-shadow(0 0 18px #2ebBff9e);animation:ship 3.2s ease-in-out infinite; }
		.ship svg { width:100%;height:auto; }
		.obama-flyby { position:fixed;top:0;z-index:2;height:auto;border:1px solid #85e6ffbf;pointer-events:none; }
		.audio-toggle { position:fixed;right:8px;bottom:30px;z-index:4;padding:7px 10px;border:1px solid #4bdcffb3;background:#041121e6;color:#a4efff;font:700 .65rem Consolas,monospace;letter-spacing:.12em;cursor:pointer; }
		.audio-toggle[aria-pressed="true"] { border-color:#57ff9dcc;color:#a7ffc6; }
		.audio-toggle:focus-visible { outline:2px solid white;outline-offset:3px; }
		.photo-credit { position:fixed;right:8px;bottom:7px;z-index:4;color:#d2e0f2b8;font-size:.62rem;text-decoration:none; }
		@keyframes sweep { to { transform:rotate(360deg); } } @keyframes blink { to { opacity:.4; } } @keyframes pulse { to { opacity:.72; } } @keyframes ship { 50% { transform:translate(-50%,-14px) rotate(1deg); } }
		@media(max-width:600px) { .score{top:14px;left:14px;min-width:0;padding:9px 11px}.vitals{top:14px;right:14px;width:min(180px,43vw);gap:7px}.vital{padding:7px 9px}.radar{top:145px;right:14px;width:130px;height:130px}.radar-title{top:125px;right:14px}.weapon{bottom:154px;left:14px;min-width:205px;padding:9px 11px}.ship{width:clamp(120px,34vw,175px)} }
		@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:8s!important; } }
	</style>
</head>
<body>
	<canvas id="battlefield" aria-label="Animated space battle with stars, meteors, and laser fire"></canvas>
	<div class="space-haze" aria-hidden="true"></div>
	<main class="hud" aria-label="Galactic Scrimmage game display">
		<div class="panel score"><span class="panel-label">SCORE</span><strong class="panel-value">018350</strong></div>
		<div class="vitals"><div class="vital"><div class="vital-heading"><span>HEALTH</span><strong>84%</strong></div><div class="meter"><div class="meter-fill"></div></div></div><div class="vital shield"><div class="vital-heading"><span>SHIELD</span><strong>98%</strong></div><div class="meter"><div class="meter-fill"></div></div></div></div>
		<span class="radar-title">RADAR // SECTOR 07</span>
		<div class="radar" role="img" aria-label="Radar scope with a moving O.B.A.M.A. contact"><span class="radar-sweep"></span><i class="blip one"></i><i class="blip two"></i><i class="blip three"></i><i class="blip hostile"></i><span class="obama-track"><span>O.B.A.M.A.</span></span></div>
		<div class="panel weapon"><span class="panel-label">WEAPON SYSTEM</span><strong class="panel-value">MK-II BLASTER</strong><span class="panel-label" style="margin:10px 0 0">AMMO // 10</span></div>
		<div class="overheat">!! OVERHEAT !!</div>
		<div class="ship" aria-label="Player spacecraft"><svg viewBox="0 0 240 250" aria-hidden="true"><defs><linearGradient id="hull" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0fcff"/><stop offset=".42" stop-color="#63cbe8"/><stop offset="1" stop-color="#163c72"/></linearGradient></defs><path d="M92 168L77 218l28-19 15 45 15-45 28 19-15-50Z" fill="#31d9ff" opacity=".8"/><path d="M114 38l-11 54-78 66-7 32 78-26 14 40 10 12 10-12 14-40 78 26-7-32-78-66-11-54-6-19Z" fill="url(#hull)" stroke="#bcefff" stroke-width="3"/><path d="M120 43v140" stroke="#f1ffff" stroke-width="3"/><path d="M120 72c-18 19-17 44 0 59 17-15 18-40 0-59Z" fill="#72f5ff" stroke="#e2ffff" stroke-width="3"/></svg></div>
	</main>
	<a class="photo-credit" href="https://commons.wikimedia.org/wiki/File:Barack_H._Obama_(4x5).png" target="_blank" rel="noopener noreferrer">Portrait: Pete Souza / CC BY 3.0</a>
	<button class="audio-toggle" id="audio-toggle" type="button" aria-pressed="false">ENABLE AUDIO</button>
	<audio id="obamna-audio" preload="auto"><source src="../../../../Media/In-Class/Week-11/obamna.mp3" type="audio/mpeg"></audio>
	<audio id="thanks-obama-audio" preload="auto"><source src="../../../../Media/In-Class/Week-11/thanks-obama-mp3cut.mp3" type="audio/mpeg"></audio>
	<script>
	(() => {
		const canvas = document.getElementById("battlefield");
		const ctx = canvas.getContext("2d");
		const radarTrack = document.querySelector(".obama-track");
		const obamaAudio = document.getElementById("obamna-audio");
		const thanksAudio = document.getElementById("thanks-obama-audio");
		const toggle = document.getElementById("audio-toggle");
		let width = 0, height = 0, lastTime = 0, soundEnabled = false, activeImage = null;
		let stars = [], meteors = [], lasers = [], nextFlyby = 0, lastMeteor = 0, lastLaser = 0;

		function resize() {
			width = innerWidth; height = innerHeight;
			const ratio = Math.min(devicePixelRatio || 1, 2);
			canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
			ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
			stars = Array.from({length: Math.min(230, Math.round(width * height / 5500))}, () => ({x:Math.random()*width,y:Math.random()*height,size:Math.random()*1.5+.5,speed:Math.random()*53+12,alpha:Math.random()*.65+.35}));
		}
		function safePlay(audio) {
			if (!soundEnabled) return;
			const result = audio.play();
			if (result && typeof result.catch === "function") result.catch(() => {});
		}
		function playThanksObama() {
			// Use the original audio element and restart it; don't create unmanaged clones.
			if (!soundEnabled || !thanksAudio.paused) return;
			try { thanksAudio.currentTime = 0; } catch (_) { /* Metadata may not be ready yet. */ }
			safePlay(thanksAudio);
		}
		function stopAudio() {
			for (const audio of [obamaAudio, thanksAudio]) {
				audio.pause();
				try { audio.currentTime = 0; } catch (_) { /* Ignore unavailable media metadata. */ }
			}
		}
		toggle.addEventListener("click", () => {
			soundEnabled = !soundEnabled;
			toggle.setAttribute("aria-pressed", String(soundEnabled));
			toggle.textContent = soundEnabled ? "MUTE AUDIO" : "ENABLE AUDIO";
			if (!soundEnabled) stopAudio();
			else if (activeImage) safePlay(obamaAudio);
		});
		function addFlyby(now) {
			const imageWidth = 76 + Math.random()*46, dir = Math.random() > .5 ? 1 : -1;
			const image = document.createElement("img");
			image.className = "obama-flyby";
			image.src = "https://upload.wikimedia.org/wikipedia/commons/e/ec/Barack_H._Obama_%284x5%29.png";
			image.alt = "Barack Obama"; image.style.width = `${imageWidth}px`; image.style.top = `${12+Math.random()*60}vh`;
			document.body.appendChild(image); activeImage = image; radarTrack.classList.add("is-active");
			const from = dir > 0 ? -imageWidth : width + imageWidth, to = dir > 0 ? width + imageWidth : -imageWidth;
			const animation = image.animate([{left:`${from}px`},{left:`${to}px`}], {duration:7500+Math.random()*3000,easing:"linear"});
			const cleanup = () => { image.remove(); if (activeImage === image) { activeImage = null; radarTrack.classList.remove("is-active"); obamaAudio.pause(); } };
			animation.onfinish = cleanup; image.onerror = cleanup;
		}
		function addMeteor() { meteors.push({x:Math.random()*width,y:-20,r:8+Math.random()*16,v:90+Math.random()*70}); }
		function draw(now) {
			const dt = Math.min((now-lastTime)/1000 || 0, .04); lastTime = now;
			ctx.clearRect(0,0,width,height);
			for (const star of stars) { star.y += star.speed*dt; if(star.y>height) {star.y=0;star.x=Math.random()*width;} ctx.globalAlpha=star.alpha;ctx.fillStyle="#fff";ctx.fillRect(star.x,star.y,star.size,star.size); }
			ctx.globalAlpha=1;
			if(now>=nextFlyby) { addFlyby(now); nextFlyby=now+15000+Math.random()*8000; }
			if(activeImage && activeImage.isConnected) { const rect=activeImage.getBoundingClientRect();radarTrack.style.left=`${Math.max(0,Math.min(1,(rect.left+rect.width/2)/width))*100}%`;radarTrack.style.top=`${Math.max(0,Math.min(1,(rect.top+rect.height/2)/height))*100}%`; if(soundEnabled && activeImage.complete && activeImage.naturalWidth) safePlay(obamaAudio); }
			if(now-lastMeteor>1000) { addMeteor();lastMeteor=now; }
			for(let i=meteors.length-1;i>=0;i--) { const m=meteors[i];m.y+=m.v*dt;ctx.fillStyle="#e98555";ctx.shadowBlur=14;ctx.shadowColor="#ff754c";ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();if(m.y>height+m.r)meteors.splice(i,1); }
			ctx.shadowBlur=0;
			if(now-lastLaser>540) { const ship=document.querySelector(".ship").getBoundingClientRect();const target=meteors.find(m=>m.y<height*.7);lasers.push({x:ship.left+ship.width/2,y:ship.top+12,endX:target?target.x:Math.random()*width,endY:target?target.y:height*.3,life:0,duration:.35,curved:!!activeImage && Math.random()<.35});lastLaser=now; }
			for(let i=lasers.length-1;i>=0;i--) { const l=lasers[i];l.life+=dt;const p=Math.min(l.life/l.duration,1);ctx.globalAlpha=1-p;ctx.strokeStyle="#55efff";ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor="#39edff";ctx.beginPath();ctx.moveTo(l.x,l.y);if(l.curved) { const cx=(l.x+l.endX)/2+(l.endY-l.y)*.25;const cy=(l.y+l.endY)/2;ctx.quadraticCurveTo(cx,cy,l.x+(l.endX-l.x)*p,l.y+(l.endY-l.y)*p);if(!l.played && soundEnabled){l.played=true;playThanksObama();} } else ctx.lineTo(l.x+(l.endX-l.x)*p,l.y+(l.endY-l.y)*p);ctx.stroke();if(p>=1)lasers.splice(i,1); }
			ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(draw);
		}
		window.addEventListener("resize",resize);resize();requestAnimationFrame(draw);
	})();
	</script>
</body>
</html>
