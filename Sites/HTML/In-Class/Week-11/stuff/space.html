<style>
:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;background:#030612;color:#e7faff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(ellipse at 50% 78%,rgba(30,21,86,.62),transparent 46%),radial-gradient(ellipse at 12% 35%,rgba(7,61,93,.38),transparent 36%),#030612}#battlefield{position:fixed;inset:0;width:100%;height:100%;z-index:0}.space-haze{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(2,5,17,.15),transparent 25%,transparent 68%,rgba(3,5,17,.5)),radial-gradient(ellipse at 50% 54%,transparent 35%,rgba(2,5,16,.36))}.hud{position:fixed;inset:0;z-index:3;pointer-events:none}.panel{position:absolute;min-width:190px;padding:11px 15px 12px;border:1px solid rgba(77,222,255,.72);background:linear-gradient(135deg,rgba(4,22,38,.88),rgba(4,10,25,.72));box-shadow:inset 0 0 18px #19b5ff1f,0 0 18px #00aaff29;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));text-shadow:0 0 8px currentColor}.panel-label{display:block;margin-bottom:5px;color:#54deff;font-size:.68rem;font-weight:800;letter-spacing:.2em}.panel-value{font:700 clamp(1rem,1.8vw,1.45rem) Consolas,"Courier New",monospace;letter-spacing:.08em}.score{top:24px;left:26px;color:#eaff71;border-color:#e0ff5ccc}.score .panel-label{color:#eaff71}.vitals{position:absolute;top:24px;right:26px;display:grid;gap:10px;width:min(230px,34vw)}.vital{padding:9px 12px 10px;border:1px solid #55ff9fb3;background:#041718d1;color:#a7ffc6;font:700 .68rem Consolas,monospace}.vital.shield{border-color:#c575ffc2;background:#170924d6;color:#e3c2ff}.vital-heading{display:flex;justify-content:space-between;margin-bottom:7px;letter-spacing:.17em}.meter{height:7px;overflow:hidden;border:1px solid currentColor;background:#0008}.meter-fill{width:84%;height:100%;background:currentColor}.shield .meter-fill{width:98%}.radar{position:absolute;top:156px;right:26px;width:170px;height:170px;overflow:hidden;border:2px solid #b55cff;border-radius:50%;background:radial-gradient(circle,transparent 0 24%,#c45bff61 24.5% 25%,transparent 25.5% 49%,#c45bff61 49.5% 50%,transparent 50.5% 74%,#c45bff61 74.5% 75%,transparent 75.5%),radial-gradient(circle,#3f0c85c2,#070519e8);box-shadow:inset 0 0 24px #cd57ff3d,0 0 18px #c03fff61}.radar:before,.radar:after{content:"";position:absolute;background:#d384ff57;pointer-events:none}.radar:before{top:50%;width:100%;height:1px}.radar:after{left:50%;height:100%;width:1px}.radar-title{position:absolute;top:133px;right:26px;z-index:4;color:#e8c1ff;font:700 .62rem Consolas,monospace;letter-spacing:.16em}.radar-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0 300deg,#51ffa108 325deg,#51ffa166);animation:sweep 4s linear infinite}.blip{position:absolute;z-index:2;width:5px;height:5px;border-radius:50%;background:#59ff9d;box-shadow:0 0 8px 2px #59ff9d;animation:blink 1.5s ease-in-out infinite alternate;transform:translate(-50%,-50%)}.blip.one{top:31%;left:31%}.blip.two{top:62%;left:74%}.blip.three{top:75%;left:43%}.blip.hostile{top:45%;left:63%;background:#ff526d;box-shadow:0 0 8px 2px #ff526d}.radar-contact{position:absolute;z-index:2;width:5px;height:5px;border-radius:50%;background:#ffb45c;box-shadow:0 0 7px 2px #ff754c;transform:translate(-50%,-50%);pointer-events:none}.radar-contact.fragment-contact{width:3px;height:3px;background:#ffe0a0;box-shadow:0 0 5px #ff9860}.obama-track{position:absolute;z-index:5;display:none;width:8px;height:8px;border:1px solid #fff3ad;border-radius:50%;background:#ffe66d;box-shadow:0 0 5px 2px #ffe66d;transform:translate(-50%,-50%)}.obama-track.is-active{display:block}.obama-track span{position:absolute;top:50%;left:calc(100% + 5px);padding:2px 3px;transform:translateY(-50%);background:#0f0d1ee8;color:#fff3ad;font:800 .5rem Consolas,monospace;white-space:nowrap}.obama-track.to-left span{right:calc(100% + 5px);left:auto}.weapon{bottom:26px;left:26px;min-width:240px;color:#9af4ff}.weapon .panel-value{font-size:1rem}.ammo-readout{display:flex;gap:4px;margin-top:9px}.ammo-readout i{width:5px;height:15px;border:1px solid #5aeaff;background:#5aeaff}.ammo-readout i:last-child,.ammo-readout i:nth-last-child(2){background:transparent}.overheat{position:absolute;top:50%;left:50%;padding:12px 20px;transform:translate(-50%,-50%);border:2px solid #ff514b;background:#26040ac2;color:#ff7368;font:900 clamp(.9rem,2vw,1.35rem) Consolas,monospace;letter-spacing:.18em;animation:pulse .9s infinite alternate;white-space:nowrap}.overheat:before,.overheat:after{content:"!!";margin:0 9px}.ship{position:absolute;bottom:-1vh;left:50%;width:clamp(125px,18vw,230px);filter:drop-shadow(0 0 18px #2ebBff9e);animation:ship 3.2s ease-in-out infinite}.ship svg{display:block;width:100%;height:auto}.obama-flyby{position:fixed;top:0;left:0;z-index:2;width:100px;height:auto;border:1px solid #85e6ffbf;pointer-events:none;will-change:left}.audio-toggle{position:fixed;right:8px;bottom:30px;z-index:12;padding:7px 10px;border:1px solid #4bdcffb3;background:#041121e6;color:#a4efff;font:700 .65rem Consolas,monospace;letter-spacing:.08em;cursor:pointer}.audio-toggle[aria-pressed=true]{border-color:#57ff9dcc;color:#a7ffc6}.key-hint{position:fixed;right:8px;bottom:61px;z-index:12;color:#b8d8e8;font:600 .58rem Consolas,monospace}.audio-toggle:focus-visible{outline:2px solid white;outline-offset:3px}.radar-glitch{position:absolute;z-index:6;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 0 9px #23d9ff)}.radar-glitch i{position:absolute;width:8px;height:7px;background:#23d9ff;box-shadow:0 0 8px #23d9ff}.radar-glitch i:nth-child(2){background:#ff3157;box-shadow:0 0 8px #ff3157}.radar-glitch i:nth-child(3){background:#57aaff;box-shadow:0 0 8px #57aaff}.radar-glitch i:nth-child(4){background:#f54265;box-shadow:0 0 7px #f54265}.radar-glitch.active{animation:glitch-shake .06s steps(2,end) infinite}.radar-glitch.active i:nth-child(even){animation:glitch-flicker .1s steps(2,end) infinite}#screen-tearing{position:fixed;inset:0;z-index:10;display:none;pointer-events:none;overflow:hidden;mix-blend-mode:screen}body.screen-tearing #screen-tearing{display:block}#screen-tearing:before,#screen-tearing:after{content:"";position:absolute;inset:-12%;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(35,217,255,.3) 6px 8px,transparent 9px 15px,rgba(255,49,87,.24) 16px 19px,transparent 20px 29px);animation:tear-scan .055s steps(2,end) infinite;filter:contrast(2)}#screen-tearing:after{background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(255,49,87,.46) 12px 18px,transparent 19px 25px,rgba(35,217,255,.35) 26px 30px,transparent 31px 43px);animation:tear-jump .075s steps(2,end) infinite;mix-blend-mode:difference}.tear-band{position:absolute;left:-10%;width:120%;height:8vh;background:linear-gradient(90deg,transparent,rgba(32,220,255,.24),rgba(255,35,90,.32),transparent);mix-blend-mode:screen;animation:band-jump .07s steps(2,end) infinite}.tear-band:nth-child(1){top:9%}.tear-band:nth-child(2){top:27%;animation-delay:-.03s}.tear-band:nth-child(3){top:48%;animation-delay:-.05s}.tear-band:nth-child(4){top:71%;animation-delay:-.02s}@keyframes sweep{to{transform:rotate(360deg)}}@keyframes blink{from{opacity:.42}to{opacity:1}}@keyframes pulse{from{opacity:.72}to{opacity:1}}@keyframes ship{0%,100%{transform:translate(-50%,0) rotate(-1deg)}50%{transform:translate(-50%,-14px) rotate(1deg)}}@keyframes glitch-shake{0%{translate:-4px 3px;rotate:-7deg}50%{translate:4px -3px;rotate:7deg}100%{translate:-3px -4px;rotate:-6deg}}@keyframes glitch-flicker{50%{opacity:.1;translate:5px -4px}}@keyframes tear-scan{0%{transform:translate(-4%,-3%) skewY(1deg);clip-path:inset(3% 0 76% 0)}33%{transform:translate(5%,2%) skewY(-1deg);clip-path:inset(31% 0 48% 0)}66%{transform:translate(-6%,1%);clip-path:inset(58% 0 18% 0)}100%{transform:translate(4%,-2%);clip-path:inset(79% 0 2% 0)}}@keyframes tear-jump{0%{transform:translateX(6%);clip-path:inset(12% 0 72% 0)}50%{transform:translateX(-7%);clip-path:inset(41% 0 34% 0)}100%{transform:translateX(5%);clip-path:inset(69% 0 8% 0)}}@keyframes band-jump{0%{transform:translateX(-8%) skewY(2deg);opacity:.2}50%{transform:translateX(9%) skewY(-2deg);opacity:.9}100%{transform:translateX(-5%);opacity:.4}}@media(max-width:600px){.score{top:14px;left:14px;min-width:0;padding:9px 11px}.vitals{top:14px;right:14px;width:min(180px,43vw);gap:7px}.vital{padding:7px 9px}.radar{top:145px;right:14px;width:130px;height:130px}.radar-title{top:125px;right:14px}.weapon{bottom:154px;left:14px;min-width:205px;padding:9px 11px}.ship{width:clamp(120px,34vw,175px)}}@media(prefers-reduced-motion:reduce){body.screen-tearing #screen-tearing:before,body.screen-tearing #screen-tearing:after,.tear-band,.radar-glitch.active,.radar-glitch.active i{animation-duration:.25s!important}}

<canvas id="battlefield" aria-label="Animated space battle with stars, meteors, and laser fire"></canvas><div class="space-haze" aria-hidden="true"></div><div id="screen-tearing" aria-hidden="true"><i class="tear-band"></i><i class="tear-band"></i><i class="tear-band"></i><i class="tear-band"></i></div>

oke-width="3"/><path d="M120 43v140" stroke="#f1ffff" stroke-width="3" opacity=".8"/><path d="M104 101l-55 56 45-14zM136 101l55 56-45-14z" fill="#225c9b" stroke="#6de5ff" stroke-width="2"/><path d="M120 72c-18 19-17 44 0 59 17-15 18-40 0-59Z" fill="#72f5ff" stroke="#e2ffff" stroke-width="3"/><path d="M24 173l55-16-11 20-45 10zM216 173l-55-16 11 20 45 10z" fill="#e84f66" stroke="#ffb5c1" stroke-width="2"/><circle cx="120" cy="155" r="5" fill="#f3ffb0"/></svg></div></main>

<audio id="obamna-audio" preload="auto"><source src="../../../../Media/In-Class/Week-11/obamna.mp3" type="audio/mpeg"></audio><audio id="thanks-obama-audio" preload="auto"><source src="../../../../Media/In-Class/Week-11/thanks-obama-mp3cut.mp3" type="audio/mpeg"></audio>
<script>
(()=>{
const canvas=document.getElementById("battlefield"),ctx=canvas.getContext("2d"),radar=document.querySelector(".radar"),track=document.querySelector(".obama-track"),obamna=document.getElementById("obamna-audio"),thanks=document.getElementById("thanks-obama-audio"),toggle=document.getElementById("audio-toggle"),ship=document.querySelector(".ship");
const stars=[],meteors=[],lasers=[],explosions=[];let w=0,h=0,ratio=1,last=0,lastMeteor=0,lastLaser=0,nextExplosion=0,nextFlyby=0,activeImage=null,soundEnabled=false,glitch=null,glitchEnd=0,nextGlitchCheck=0,jitter=0,forceGlitch=false;
const random=(a,b)=>Math.random()*(b-a)+a;
function resize(){w=innerWidth;h=innerHeight;ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);stars.length=0;for(let i=0;i<Math.min(230,Math.round(w*h/5500));i++)stars.push({x:Math.random()*w,y:Math.random()*h,size:random(.5,2),speed:random(12,65),alpha:random(.35,1),tint:Math.random()>.82?"#7ceaff":"#fff"})}
function play(audio){return audio.play()}
function updateAudioUI(playing){soundEnabled=playing;toggle.setAttribute("aria-pressed",String(playing));toggle.textContent=playing?"MUTE AUDIO":"TAP TO ENABLE AUDIO"}
function tryStartAudio(){obamna.loop=true;const result=play(obamna);if(result&&result.then)result.then(()=>updateAudioUI(true)).catch(()=>updateAudioUI(false));else updateAudioUI(true)}
function stopAudio(){obamna.pause();obamna.loop=false;thanks.pause();try{obamna.currentTime=0;thanks.currentTime=0}catch(_){}updateAudioUI(false)}
toggle.addEventListener("click",()=>{if(soundEnabled)stopAudio();else tryStartAudio()});
// Browsers commonly block audible autoplay. Reflect that accurately and enable playback on first gesture.
tryStartAudio();
function safeThanks(){if(!soundEnabled||!thanks.paused)return;try{thanks.currentTime=0}catch(_){}const p=play(thanks);if(p&&p.catch)p.catch(()=>{})}
document.addEventListener("keydown",e=>{if(e.repeat||e.key.toLowerCase()!=="g")return;const t=e.target;if(t&&(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable))return;forceGlitch=true});
function createMeteor(x,y,r,fragment=false){const contact=document.createElement("i");contact.className="radar-contact"+(fragment?" fragment-contact":"");contact.setAttribute("aria-hidden","true");radar.appendChild(contact);return{x,y,r,vertices:Array.from({length:9},()=>r*random(.72,1.24)),vx:fragment?random(-180,180):random(-28,28),vy:fragment?random(100,260):random(90,155),rotation:random(0,Math.PI*2),spin:random(-1.5,1.5),fragment,targeted:false,contact}}
function explosion(x,y,r,color){const particles=[];for(let i=0,n=Math.round(random(18,30)*Math.min(r/20,1.5));i<n;i++){const a=random(0,Math.PI*2),s=random(35,220)*Math.min(r/18,1.6);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,size:random(1.2,4),alpha:random(.65,1)})}explosions.push({x,y,r,color,particles,life:0,duration:.65})}
function split(m){explosion(m.x,m.y,m.r*1.6,"#ffb34e");if(m.fragment)return;for(let i=0,n=Math.round(random(5,8));i<n;i++){const f=createMeteor(m.x+random(-m.r*.5,m.r*.5),m.y+random(-m.r*.5,m.r*.5),random(Math.max(3,m.r*.16),Math.max(5,m.r*.32)),true);f.vx+=m.vx*.35;f.vy+=m.vy*.35;meteors.push(f)}}
function addMeteor(){const r=random(Math.min(14,w*.035),Math.min(30,w*.075));meteors.push(createMeteor(random(w*.08,w*.92),random(-h*.12,h*.2),r))}
function flyby(){const iw=random(76,122),dir=Math.random()>.5?1:-1,sx=dir>0?-iw:w+iw,ex=dir>0?w+iw:-iw,img=document.createElement("img");img.className="obama-flyby";img.src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Barack_H._Obama_%284x5%29.png";img.alt="Barack Obama";img.style.width=iw+"px";img.style.top=random(12,72)+"vh";activeImage=img;track.classList.add("is-active");document.body.appendChild(img);const anim=img.animate([{left:sx+"px"},{left:ex+"px"}],{duration:random(6500,10500),easing:"linear"});const clean=()=>{img.remove();if(activeImage===img){activeImage=null;track.classList.remove("is-active");obamna.pause();obamna.loop=false;try{obamna.currentTime=0}catch(_){}}};anim.onfinish=clean;img.onerror=clean}
function startGlitch(now){if(glitch)return;glitch=document.createElement("span");glitch.className="radar-glitch active";glitch.setAttribute("aria-hidden","true");for(let i=0;i<4;i++)glitch.appendChild(document.createElement("i"));radar.appendChild(glitch);glitchEnd=now+random(6000,10000);jitter=0;document.body.classList.add("screen-tearing")}
function updateGlitch(now){if(!nextGlitchCheck)nextGlitchCheck=now+60000;if(now>=nextGlitchCheck){nextGlitchCheck=now+60000;if(forceGlitch||Math.random()<.01){forceGlitch=false;startGlitch(now)}}if(!glitch)return;if(now>=glitchEnd){glitch.remove();glitch=null;document.body.classList.remove("screen-tearing");return}if(now-jitter>55){jitter=now;glitch.style.left=random(10,90)+"%";glitch.style.top=random(10,90)+"%";for(const shard of glitch.children){shard.style.left=random(-7,15)+"px";shard.style.top=random(-7,15)+"px";shard.style.width=random(4,8)+"px";shard.style.height=random(4,8)+"px"}}}
function interval(a,b,r){const dx=b.x-a.x,dy=b.y-a.y;let en=0,ex=1;for(const[p,q]of[[-dx,a.x-r.left],[dx,r.right-a.x],[-dy,a.y-r.top],[dy,r.bottom-a.y]]){if(!p){if(q<0)return null;continue}const t=q/p;if(p<0){if(t>ex)return null;en=Math.max(en,t)}else{if(t<en)return null;ex=Math.min(ex,t)}}return en<=ex?[en,ex]:null}
function obamaBounds(d){if(!activeImage||!activeImage.isConnected)return null;const b=activeImage.getBoundingClientRect(),m=Number(activeImage.dataset.flybySpeed||0)*d+12;return{left:b.left-m,right:b.right+m,top:b.top-10,bottom:b.bottom+10}}
function laserPath(start,end,d){const box=obamaBounds(d),hit=box&&interval(start,end,box);if(!hit)return[start,end];const len=Math.hypot(end.x-start.x,end.y-start.y)||1;if(hit[0]<=0||hit[1]>=1)return null;const pad=8/len,t0=Math.max(0,hit[0]-pad),t1=Math.min(1,hit[1]+pad),entry={x:start.x+(end.x-start.x)*t0,y:start.y+(end.y-start.y)*t0},exit={x:start.x+(end.x-start.x)*t1,y:start.y+(end.y-start.y)*t1},nx=-(end.y-start.y)/len,ny=(end.x-start.x)/len,mid={x:(entry.x+exit.x)/2,y:(entry.y+exit.y)/2},offset=Math.max(box.right-box.left,box.bottom-box.top)*.65+18;for(const side of[-1,1]){const c={x:mid.x+nx*offset*side,y:mid.y+ny*offset*side},path=[start,entry];let prev=entry,ok=true;for(let i=1;i<=32;i++){const t=i/32,u=1-t,p={x:u*u*entry.x+2*u*t*c.x+t*t*exit.x,y:u*u*entry.y+2*u*t*c.y+t*t*exit.y};if(interval(prev,p,box)){ok=false;break}path.push(p);prev=p}if(ok)return path.concat(end)}return null}
function drawMeteor(m){const speed=Math.hypot(m.vx,m.vy)||1,tail=m.r*(m.fragment?3:4.5),tx=m.x-m.vx/speed*tail,ty=m.y-m.vy/speed*tail,g=ctx.createLinearGradient(tx,ty,m.x,m.y);g.addColorStop(0,"transparent");g.addColorStop(1,m.fragment?"#ff9860":"#ffb45c");ctx.strokeStyle=g;ctx.lineWidth=Math.max(1.5,m.r*.45);ctx.shadowBlur=m.fragment?8:18;ctx.shadowColor="#ff754c";ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.stroke();const rock=ctx.createRadialGradient(m.x-m.r*.35,m.y-m.r*.4,1,m.x,m.y,m.r*1.25);rock.addColorStop(0,"#ffe0a0");rock.addColorStop(.32,"#c86b45");rock.addColorStop(1,"#38243a");ctx.fillStyle=rock;ctx.strokeStyle="#ffcf8a";ctx.lineWidth=m.fragment?.8:1.4;ctx.beginPath();m.vertices.forEach((v,i)=>{const a=m.rotation+i/m.vertices.length*Math.PI*2,x=m.x+Math.cos(a)*v,y=m.y+Math.sin(a)*v;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill();if(!m.fragment)ctx.stroke()}
function addLaser(){const b=ship.getBoundingClientRect(),start={x:b.left+b.width/2,y:b.top+b.height*.08},duration=random(.28,.4),targets=meteors.filter(m=>!m.fragment&&!m.targeted&&m.y<h*.76).sort((a,b)=>a.y-b.y);let target=null,path=null;for(const m of targets){const p=laserPath(start,{x:m.x,y:m.y},duration);if(p){target=m;path=p;break}}if(!target){for(let i=0;i<8;i++){const p=laserPath(start,{x:start.x+random(-w*.32,w*.32),y:random(h*.12,h*.48)},duration);if(p){path=p;break}}if(!path)return}else target.targeted=true;let length=0;for(let i=1;i<path.length;i++)length+=Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);lasers.push({path,length,target,life:0,duration,color:Math.random()>.5?"#39edff":"#86fbff",played:false})}
function drawExplosions(dt){for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.life+=dt;const p=Math.min(e.life/e.duration,1),a=1-p;ctx.globalAlpha=a;ctx.strokeStyle=e.color;ctx.lineWidth=Math.max(1,e.r*.12*a);ctx.shadowBlur=20;ctx.shadowColor=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(.25+p),0,Math.PI*2);ctx.stroke();ctx.fillStyle="#ffd789";ctx.beginPath();ctx.arc(e.x,e.y,e.r*(.4+p*.35)*a,0,Math.PI*2);ctx.fill();for(const q of e.particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;ctx.globalAlpha=a*q.alpha;ctx.fillStyle=e.color;ctx.fillRect(q.x,q.y,q.size,q.size)}ctx.globalAlpha=1;if(p>=1)explosions.splice(i,1)}}
function draw(now){const dt=Math.min((now-(last||now))/1000,.04);last=now;const time=now/1000;if(!nextFlyby)nextFlyby=now+random(1800,4200);if(now>=nextFlyby){flyby();nextFlyby=now+random(12000,21000)}updateGlitch(now);ctx.clearRect(0,0,w,h);for(const s of stars){s.y+=s.speed*dt;if(s.y>h+2){s.y=-2;s.x=Math.random()*w}ctx.globalAlpha=s.alpha*(.72+Math.sin(time*2+s.x)*.18);ctx.fillStyle=s.tint;ctx.fillRect(s.x,s.y,s.size,s.size)}ctx.globalAlpha=1;
if(activeImage&&activeImage.isConnected){const b=activeImage.getBoundingClientRect();if(b.right>0&&b.left<w){const x=Math.max(0,Math.min(1,(b.left+b.width/2)/w)),y=Math.max(0,Math.min(1,(b.top+b.height/2)/h));track.style.left=x*100+"%";track.style.top=y*100+"%";track.classList.toggle("to-left",x>.68);if(soundEnabled&&activeImage.complete&&activeImage.naturalWidth&&!obamna.paused){} }else{obamna.pause();obamna.loop=false;track.classList.remove("is-active")}}
if(now-lastMeteor>1050){addMeteor();lastMeteor=now}if(now-lastLaser>540){addLaser();lastLaser=now}if(now>nextExplosion){explosion(random(w*.12,w*.88),random(h*.12,h*.7),random(12,24),"#ff765e");nextExplosion=now+random(2800,5200)}
for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.rotation+=m.spin*dt;m.contact.style.left=Math.max(0,Math.min(100,m.x/w*100))+"%";m.contact.style.top=Math.max(0,Math.min(100,m.y/h*100))+"%";drawMeteor(m);if(m.y>h+m.r*5||m.x< -m.r*5||m.x>w+m.r*5){m.contact.remove();meteors.splice(i,1)}}
for(let i=lasers.length-1;i>=0;i--){const l=lasers[i];l.life+=dt;const p=Math.min(l.life/l.duration,1);if(l.target&&meteors.includes(l.target)){l.target.x+=l.target.vx*dt;l.target.y+=l.target.vy*dt;}const distance=l.length*p;ctx.globalAlpha=Math.max(0,1-p);ctx.strokeStyle=l.color;ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor=l.color;ctx.beginPath();ctx.moveTo(l.path[0].x,l.path[0].y);let rem=distance;for(let j=1;j<l.path.length;j++){const a=l.path[j-1],b=l.path[j],seg=Math.hypot(b.x-a.x,b.y-a.y);if(rem>=seg){ctx.lineTo(b.x,b.y);rem-=seg}else{const t=seg?rem/seg:1;ctx.lineTo(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);break}}ctx.stroke();ctx.globalAlpha*=.52;ctx.lineWidth=8;ctx.stroke();ctx.globalAlpha=1;if(!l.played&&l.path.length>2&&distance>l.length*.2){l.played=true;safeThanks()}if(p>=1){if(l.target&&meteors.includes(l.target)){const idx=meteors.indexOf(l.target);split(l.target);l.target.contact.remove();meteors.splice(idx,1)}lasers.splice(i,1)}}ctx.globalAlpha=1;ctx.shadowBlur=0;drawExplosions(dt);requestAnimationFrame(draw)}
window.addEventListener("resize",resize);resize();requestAnimationFrame(draw);
})();
