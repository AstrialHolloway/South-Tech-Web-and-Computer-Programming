		<script>
			const liveBadge = document.getElementById("dougdoug-live");

			async function updateDougDougLiveStatus() {
				try {
					const response = await fetch("https://api.ivr.fi/v2/twitch/user?login=dougdoug", {
						cache: "no-store"
					});

					if (!response.ok) {
						throw new Error(`Twitch status request failed with HTTP ${response.status}`);
					}

					const users = await response.json();
					if (!Array.isArray(users) || !users[0] || !("stream" in users[0])) {
						throw new Error("Twitch status response did not contain the expected user data");
					}

					liveBadge.hidden = users[0].stream?.type !== "live";
				} catch (error) {
					liveBadge.hidden = true;
					console.error("Unable to check DougDoug's Twitch live status:", error);
				}
			}

			updateDougDougLiveStatus();
			setInterval(updateDougDougLiveStatus, 120000);
		</script>
	</body>
