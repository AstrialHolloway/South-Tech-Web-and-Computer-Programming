<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Craft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-workspace: #ffffff;
            --dot-color: #cbd5e1;
            --bg-sidebar: #ffffff;
            --border-color: #e2e8f0;
            --pill-bg: #ffffff;
            --pill-hover-bg: #f8fafc;
            --pill-text: #0f172a;
            --pill-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            --pill-hover-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --ui-muted: #64748b;
            --ui-btn-bg: #ffffff;
            --ui-btn-hover: #f1f5f9;
        }

        .dark {
            --bg-workspace: #0b0f19;
            --dot-color: #1e293b;
            --bg-sidebar: #0f172a;
            --border-color: #1e293b;
            --pill-bg: #162032;
            --pill-hover-bg: #1e293b;
            --pill-text: #f1f5f9;
            --pill-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
            --pill-hover-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
            --ui-muted: #94a3b8;
            --ui-btn-bg: #162032;
            --ui-btn-hover: #1e293b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-workspace);
            color: var(--pill-text);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Subtle Neal.fun style dot grid */
        #workspace {
            background-color: var(--bg-workspace);
            background-image: radial-gradient(var(--dot-color) 1.15px, transparent 1.15px);
            background-size: 24px 24px;
            transition: background-color 0.25s ease;
            touch-action: none;
        }

        #sidebar {
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        /* Authentic crisp pill styling */
        .element-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            background-color: var(--pill-bg);
            border: 1px solid var(--border-color);
            border-radius: 9px;
            color: var(--pill-text);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.2;
            box-shadow: var(--pill-shadow);
            cursor: grab;
            transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1),
                        box-shadow 0.14s ease,
                        background-color 0.14s ease,
                        border-color 0.14s ease;
            white-space: nowrap;
        }

        .element-pill:hover {
            background-color: var(--pill-hover-bg);
            box-shadow: var(--pill-hover-shadow);
            transform: translateY(-1px);
        }

        .element-pill:active {
            cursor: grabbing;
        }

        /* Canvas instance specific */
        .canvas-instance {
            position: absolute;
            z-index: 10;
            touch-action: none;
            will-change: transform, left, top;
        }

        .canvas-instance.dragging {
            z-index: 9999 !important;
            transform: scale(1.06);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
            cursor: grabbing;
        }

        .dark .canvas-instance.dragging {
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
        }

        /* Target snap highlight when hovering another element over it */
        .canvas-instance.drop-target {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            transform: scale(1.08);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25), 0 8px 20px rgba(59, 130, 246, 0.15);
        }

        .dark .canvas-instance.drop-target {
            border-color: #60a5fa !important;
            background-color: #1e3a8a !important;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.3), 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* Combining pulse animation */
        @keyframes pulseCombine {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 0.55; }
        }

        .combining-placeholder {
            animation: pulseCombine 0.85s infinite ease-in-out;
            pointer-events: none;
            border-style: dashed;
            border-color: #94a3b8;
        }

        /* Pop-in animation for newly created instances */
        @keyframes popIn {
            0% { transform: scale(0.45); opacity: 0; }
            70% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Subtle glow for newly discovered pill in sidebar */
        @keyframes newGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.55); border-color: #3b82f6; }
            100% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        }

        .new-discovery-flash {
            animation: newGlow 1.1s ease-out;
        }

        /* Discovery badge floating tag */
        @keyframes floatBadge {
            0% { opacity: 0; transform: translate(-50%, 6px) scale(0.9); }
            15% { opacity: 1; transform: translate(-50%, 0px) scale(1); }
            85% { opacity: 1; transform: translate(-50%, -4px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -10px) scale(0.95); }
        }

        .discovery-toast {
            position: absolute;
            left: 50%;
            top: -28px;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: none;
            animation: floatBadge 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* Custom sleek scrollbar for sidebar */
        #inventory-scroll::-webkit-scrollbar {
            width: 6px;
        }
        #inventory-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        #inventory-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 999px;
        }
        #inventory-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.55);
        }

        .control-btn {
            background-color: var(--ui-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--ui-muted);
            transition: all 0.15s ease;
        }
        .control-btn:hover {
            background-color: var(--ui-btn-hover);
            color: var(--pill-text);
            transform: translateY(-1px);
        }

        /* Sidebar delete dropzone highlight */
        #sidebar.delete-hover {
            background-color: rgba(239, 68, 68, 0.05);
            border-left-color: rgba(239, 68, 68, 0.45);
        }
        .dark #sidebar.delete-hover {
            background-color: rgba(239, 68, 68, 0.12);
            border-left-color: rgba(239, 68, 68, 0.5);
        }

        /* Particle burst */
        .sparkle-dot {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen overflow-hidden">

    <!-- LEFT/MAIN WORKSPACE -->
    <main id="workspace" class="relative flex-1 h-[62vh] md:h-full overflow-hidden">
        <!-- Top-Left Minimal Brand & Discovery Counter -->
        <div class="absolute top-4 left-4 z-30 flex items-center gap-3 pointer-events-none">
            <div class="px-3 py-1.5 rounded-lg border text-sm font-semibold tracking-tight flex items-center gap-2 shadow-sm pointer-events-auto"
                 style="background-color: var(--ui-btn-bg); border-color: var(--border-color); color: var(--pill-text);">
                <span>Infinite Craft</span>
                <span class="text-xs font-medium px-2 py-0.5 rounded-full"
                      style="background-color: var(--ui-btn-hover); color: var(--ui-muted);"
                      id="discovery-counter">4 discovered</span>
            </div>
        </div>

        <!-- Subtle Empty Hint -->
        <div id="empty-hint" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-300">
            <p class="text-sm font-medium px-4 py-2 rounded-full opacity-55" style="color: var(--ui-muted);">
                Drag elements from the sidebar to combine them
            </p>
        </div>

        <!-- Active Canvas Elements Layer -->
        <div id="canvas-layer" class="absolute inset-0 w-full h-full"></div>

        <!-- Bottom-Left Minimal Utility Controls -->
        <div class="absolute bottom-4 left-4 z-30 flex flex-wrap items-center gap-2">
            <button id="btn-clear" title="Clear Workspace"
                    class="control-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                <span>Clear</span>
            </button>

            <button id="btn-sound" title="Toggle Sound"
                    class="control-btn p-1.5 rounded-lg shadow-sm" aria-label="Toggle Sound">
                <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
                <svg id="icon-sound-off" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                </svg>
            </button>

            <button id="btn-theme" title="Toggle Dark Mode"
                    class="control-btn p-1.5 rounded-lg shadow-sm" aria-label="Toggle Dark Mode">
                <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </button>

            <button id="btn-reset" title="Reset All Progress"
                    class="control-btn px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm">
                Reset
            </button>
        </div>
    </main>

    <!-- RIGHT-HAND ELEMENT SIDEBAR -->
    <aside id="sidebar" class="relative w-full md:w-[330px] lg:w-[360px] h-[38vh] md:h-full flex flex-col z-20 border-t md:border-t-0">
        <!-- Trash Indicator Overlay when dragging canvas element over sidebar -->
        <div id="sidebar-trash-banner" class="hidden absolute inset-x-3 top-3 z-30 py-2 px-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs font-medium text-center pointer-events-none backdrop-blur-xs">
            Release to remove from workspace
        </div>

        <!-- Scrollable Discovered Elements List -->
        <div id="inventory-scroll" class="flex-1 overflow-y-auto p-3.5">
            <div id="inventory-list" class="flex flex-wrap gap-2 content-start pb-4">
                <!-- Pills rendered dynamically -->
            </div>
        </div>

        <!-- Bottom Search & Sort Controls (Neal.fun signature layout) -->
        <div class="p-2.5 border-t flex flex-col gap-2" style="border-color: var(--border-color); background-color: var(--bg-sidebar);">
            <div class="relative flex items-center">
                <svg class="w-4 h-4 absolute left-3 pointer-events-none" style="color: var(--ui-muted);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input id="search-input" type="text" placeholder="Search items..."
                       class="w-full pl-9 pr-8 py-1.5 text-sm rounded-lg border outline-none transition-colors"
                       style="background-color: var(--pill-bg); border-color: var(--border-color); color: var(--pill-text);">
                <button id="clear-search" class="hidden absolute right-2.5 text-xs px-1.5 py-0.5 rounded hover:opacity-80" style="color: var(--ui-muted);">
                    ✕
                </button>
            </div>

            <div class="flex items-center justify-between gap-1.5 text-xs">
                <span class="font-medium pl-1" style="color: var(--ui-muted);">Sort by:</span>
                <div class="flex items-center gap-1">
                    <button data-sort="time" class="sort-btn px-2.5 py-1 rounded-md font-medium border transition-colors">Time</button>
                    <button data-sort="name" class="sort-btn px-2.5 py-1 rounded-md font-medium border transition-colors">Name</button>
                    <button data-sort="emoji" class="sort-btn px-2.5 py-1 rounded-md font-medium border transition-colors">Emoji</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Custom Non-Blocking Confirmation Modal for Reset -->
    <div id="reset-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-[1px] p-4">
        <div class="w-full max-w-xs rounded-xl border p-5 shadow-xl"
             style="background-color: var(--bg-sidebar); border-color: var(--border-color); color: var(--pill-text);">
            <h3 class="text-base font-semibold mb-1.5">Reset Progress?</h3>
            <p class="text-xs leading-relaxed mb-4" style="color: var(--ui-muted);">
                This will clear all discovered elements and cached recipes, returning you to Water, Fire, Wind, and Earth.
            </p>
            <div class="flex justify-end gap-2">
                <button id="cancel-reset" class="control-btn px-3 py-1.5 rounded-lg text-xs font-medium">Cancel</button>
                <button id="confirm-reset" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-red-600 text-white hover:bg-red-700 transition-colors">Reset Everything</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * INFINITE CRAFT - Core Engine & State
         */
        const STORAGE_KEY_ITEMS = 'infinite_craft_items_v1';
        const STORAGE_KEY_RECIPES = 'infinite_craft_recipes_v1';
        const STORAGE_KEY_PREFS = 'infinite_craft_prefs_v1';

        // Starting 4 Elements
        const INITIAL_ELEMENTS = [
            { name: 'Water', emoji: '💧', discoveredAt: 1, isFirstDiscovery: false },
            { name: 'Fire', emoji: '🔥', discoveredAt: 2, isFirstDiscovery: false },
            { name: 'Wind', emoji: '🌬️', discoveredAt: 3, isFirstDiscovery: false },
            { name: 'Earth', emoji: '🌍', discoveredAt: 4, isFirstDiscovery: false }
        ];

        // Pre-seeded Classic Recipes (Zero-latency canonical combos)
        const SEED_RECIPES = {
            'Earth+Water': { name: 'Plant', emoji: '🌱' },
            'Fire+Water': { name: 'Steam', emoji: '💨' },
            'Earth+Fire': { name: 'Lava', emoji: '🌋' },
            'Earth+Wind': { name: 'Dust', emoji: '🌫️' },
            'Water+Wind': { name: 'Wave', emoji: '🌊' },
            'Fire+Wind': { name: 'Smoke', emoji: '💨' },
            'Water+Water': { name: 'Lake', emoji: '🏞️' },
            'Fire+Fire': { name: 'Volcano', emoji: '🌋' },
            'Wind+Wind': { name: 'Tornado', emoji: '🌪️' },
            'Earth+Earth': { name: 'Mountain', emoji: '⛰️' },
            'Lava+Water': { name: 'Stone', emoji: '🪨' },
            'Fire+Plant': { name: 'Ash', emoji: '⚱️' },
            'Plant+Water': { name: 'Swamp', emoji: '🐊' },
            'Plant+Wind': { name: 'Dandelion', emoji: '🌼' },
            'Earth+Plant': { name: 'Tree', emoji: '🌳' },
            'Lake+Water': { name: 'Ocean', emoji: '🌊' },
            'Ocean+Water': { name: 'Sea', emoji: '🌊' },
            'Steam+Wind': { name: 'Cloud', emoji: '☁️' },
            'Cloud+Water': { name: 'Rain', emoji: '🌧️' },
            'Earth+Rain': { name: 'Mud', emoji: '💩' },
            'Fire+Mud': { name: 'Brick', emoji: '🧱' },
            'Stone+Wind': { name: 'Sand', emoji: '🏖️' },
            'Fire+Sand': { name: 'Glass', emoji: '🪟' },
            'Lake+Lava': { name: 'Obsidian', emoji: '🖤' },
            'Plant+Plant': { name: 'Forest', emoji: '🌲' },
            'Tree+Tree': { name: 'Forest', emoji: '🌲' },
            'Cloud+Cloud': { name: 'Storm', emoji: '⛈️' },
            'Fire+Storm': { name: 'Lightning', emoji: '⚡' },
            'Life+Mud': { name: 'Human', emoji: '🧑' },
            'Lightning+Swamp': { name: 'Life', emoji: '🧬' },
            'Energy+Swamp': { name: 'Life', emoji: '🧬' },
            'Fire+Steam': { name: 'Engine', emoji: '🚂' },
            'Mountain+Wind': { name: 'Avalanche', emoji: '🏔️' },
            'Mountain+Water': { name: 'River', emoji: '🏞️' },
            'Earth+Lava': { name: 'Volcano', emoji: '🌋' },
            'Dust+Water': { name: 'Mud', emoji: '💩' },
            'Dust+Fire': { name: 'Gunpowder', emoji: '💥' },
            'Fire+Stone': { name: 'Metal', emoji: '⚙️' },
            'Metal+Wind': { name: 'Windmill', emoji: '🎡' },
            'Rain+Sun': { name: 'Rainbow', emoji: '🌈' },
            'Fire+Sky': { name: 'Sun', emoji: '☀️' },
            'Cloud+Sky': { name: 'Weather', emoji: '🌤️' },
            'Air+Cloud': { name: 'Sky', emoji: '🌌' },
            'Cloud+Wind': { name: 'Sky', emoji: '🌌' }
        };

        // Application State
        let discoveredItems = [];
        let recipeCache = {};
        let canvasInstances = [];
        let nextInstanceId = 1;
        let topZIndex = 20;
        let sortMode = 'time'; // 'time' | 'name' | 'emoji'
        let searchQuery = '';
        let soundEnabled = true;
        let darkMode = false;

        // DOM References
        const workspaceEl = document.getElementById('workspace');
        const canvasLayerEl = document.getElementById('canvas-layer');
        const sidebarEl = document.getElementById('sidebar');
        const inventoryListEl = document.getElementById('inventory-list');
        const discoveryCounterEl = document.getElementById('discovery-counter');
        const emptyHintEl = document.getElementById('empty-hint');
        const searchInputEl = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const trashBannerEl = document.getElementById('sidebar-trash-banner');

        /**
         * SYNTHESIZED WEB AUDIO ENGINE (Zero external assets)
         */
        const SoundFX = (() => {
            let ctx = null;
            function getCtx() {
                if (!ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) ctx = new AudioCtx();
                }
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }
                return ctx;
            }

            return {
                playPop(pitchMultiplier = 1) {
                    if (!soundEnabled) return;
                    const ac = getCtx();
                    if (!ac) return;
                    const now = ac.currentTime;
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(340 * pitchMultiplier, now);
                    osc.frequency.exponentialRampToValueAtTime(580 * pitchMultiplier, now + 0.065);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(now);
                    osc.stop(now + 0.075);
                },
                playCombine() {
                    if (!soundEnabled) return;
                    const ac = getCtx();
                    if (!ac) return;
                    const now = ac.currentTime;
                    [523.25, 659.25].forEach((freq, idx) => {
                        const osc = ac.createOscillator();
                        const gain = ac.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.045);
                        gain.gain.setValueAtTime(0.07, now + idx * 0.045);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.045 + 0.14);
                        osc.connect(gain);
                        gain.connect(ac.destination);
                        osc.start(now + idx * 0.045);
                        osc.stop(now + idx * 0.045 + 0.15);
                    });
                },
                playDiscovery(isFirst = false) {
                    if (!soundEnabled) return;
                    const ac = getCtx();
                    if (!ac) return;
                    const now = ac.currentTime;
                    const notes = isFirst ? [523.25, 659.25, 783.99, 1046.50] : [523.25, 659.25, 783.99];
                    notes.forEach((freq, i) => {
                        const osc = ac.createOscillator();
                        const gain = ac.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        gain.gain.setValueAtTime(0.09, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.28);
                        osc.connect(gain);
                        gain.connect(ac.destination);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + 0.3);
                    });
                },
                playDelete() {
                    if (!soundEnabled) return;
                    const ac = getCtx();
                    if (!ac) return;
                    const now = ac.currentTime;
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                }
            };
        })();

        /**
         * PERSISTENCE & INITIALIZATION
         */
        function loadState() {
            try {
                const savedItems = localStorage.getItem(STORAGE_KEY_ITEMS);
                const savedRecipes = localStorage.getItem(STORAGE_KEY_RECIPES);
                const savedPrefs = localStorage.getItem(STORAGE_KEY_PREFS);

                if (savedItems) {
                    discoveredItems = JSON.parse(savedItems);
                } else {
                    discoveredItems = [...INITIAL_ELEMENTS];
                }

                recipeCache = { ...SEED_RECIPES };
                if (savedRecipes) {
                    Object.assign(recipeCache, JSON.parse(savedRecipes));
                }

                if (savedPrefs) {
                    const prefs = JSON.parse(savedPrefs);
                    soundEnabled = prefs.soundEnabled !== undefined ? prefs.soundEnabled : true;
                    darkMode = !!prefs.darkMode;
                    sortMode = prefs.sortMode || 'time';
                }
            } catch (err) {
                discoveredItems = [...INITIAL_ELEMENTS];
                recipeCache = { ...SEED_RECIPES };
            }

            applyTheme();
            updateSoundIcon();
            updateSortButtons();
            renderSidebar();
            updateCounter();
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(discoveredItems));
                localStorage.setItem(STORAGE_KEY_RECIPES, JSON.stringify(recipeCache));
                localStorage.setItem(STORAGE_KEY_PREFS, JSON.stringify({
                    soundEnabled,
                    darkMode,
                    sortMode
                }));
            } catch (e) {
                // Ignore quota issues if localStorage is full
            }
        }

        function getRecipeKey(a, b) {
            return [a.trim(), b.trim()].sort((x, y) => x.localeCompare(y)).join('+');
        }

        /**
         * GEMINI API INTEGRATION FOR INFINITE COMBINATIONS
         */
        async function fetchCombinationFromAI(elemA, elemB) {
            const apiKey = ""; // Provided at runtime by environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const systemPrompt = `You are the crafting engine for the game Infinite Craft.
Combine two input concepts/elements into ONE logical, clever, humorous, or pop-culture resulting concept.
Rules:
1. Return ONLY a JSON object with keys "emoji" (a single fitting emoji) and "name" (a concise 1 to 3 word title-cased noun or phrase).
2. Be creative, intuitive, and playful like Neal.fun's Infinite Craft.
3. Never return empty strings or explanations.`;

            const userQuery = `Combine "${elemA}" + "${elemB}"`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            emoji: { type: "STRING" },
                            name: { type: "STRING" }
                        },
                        required: ["emoji", "name"]
                    }
                }
            };

            let delay = 800;
            for (let attempt = 0; attempt < 4; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (rawText) {
                        const parsed = JSON.parse(rawText);
                        if (parsed.name && parsed.emoji) {
                            // Clean name and ensure single leading emoji
                            const cleanName = String(parsed.name).trim().slice(0, 36);
                            const cleanEmoji = Array.from(String(parsed.emoji).trim())[0] || '✨';
                            return { name: cleanName, emoji: cleanEmoji, isAI: true };
                        }
                    }
                } catch (err) {
                    if (attempt < 3) {
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }
                }
            }

            // Deterministic creative fallback if offline / API unavailable
            return {
                name: `${elemA} ${elemB}`.slice(0, 32),
                emoji: '✨',
                isAI: true
            };
        }

        async function resolveRecipe(elemA, elemB) {
            const key = getRecipeKey(elemA, elemB);
            if (recipeCache[key]) {
                return { ...recipeCache[key], isAI: false };
            }

            const result = await fetchCombinationFromAI(elemA, elemB);
            recipeCache[key] = { name: result.name, emoji: result.emoji };
            saveState();
            return result;
        }

        /**
         * SIDEBAR RENDERING & FILTERING
         */
        function renderSidebar(highlightName = null) {
            let items = [...discoveredItems];

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                items = items.filter(item =>
                    item.name.toLowerCase().includes(q) || item.emoji.includes(q)
                );
            }

            if (sortMode === 'name') {
                items.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortMode === 'emoji') {
                items.sort((a, b) => a.emoji.localeCompare(b.emoji));
            } else {
                items.sort((a, b) => a.discoveredAt - b.discoveredAt);
            }

            inventoryListEl.innerHTML = '';

            if (items.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'w-full text-center py-8 text-xs';
                emptyMsg.style.color = 'var(--ui-muted)';
                emptyMsg.textContent = 'No matching items found';
                inventoryListEl.appendChild(emptyMsg);
                return;
            }

            items.forEach(item => {
                const pill = document.createElement('div');
                pill.className = 'element-pill';
                if (highlightName && item.name.toLowerCase() === highlightName.toLowerCase()) {
                    pill.classList.add('new-discovery-flash');
                }
                pill.innerHTML = `<span class="text-base leading-none pointer-events-none">${item.emoji}</span><span class="pointer-events-none">${escapeHtml(item.name)}</span>`;

                // Pointer down starts dragging a fresh clone onto workspace
                pill.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0 && e.pointerType === 'mouse') return;
                    e.preventDefault();
                    startSidebarDrag(e, item);
                });

                // Quick tap/click on mobile or desktop also spawns conveniently if not dragged
                inventoryListEl.appendChild(pill);
            });
        }

        function updateCounter() {
            discoveryCounterEl.textContent = `${discoveredItems.length} discovered`;
        }

        function updateEmptyHint() {
            if (canvasInstances.length > 0) {
                emptyHintEl.style.opacity = '0';
            } else {
                emptyHintEl.style.opacity = '1';
            }
        }

        /**
         * CANVAS INSTANCE MANAGEMENT & INTERACTION
         */
        function spawnCanvasInstance(item, x, y, options = {}) {
            const id = nextInstanceId++;
            const el = document.createElement('div');
            el.className = 'element-pill canvas-instance pop-in';
            el.dataset.instanceId = id;
            el.style.zIndex = ++topZIndex;
            el.innerHTML = `<span class="text-base leading-none pointer-events-none">${item.emoji}</span><span class="pointer-events-none">${escapeHtml(item.name)}</span>`;

            if (options.discoveryBadge) {
                const badge = document.createElement('div');
                badge.className = 'discovery-toast';
                if (options.discoveryBadge === 'First Discovery!') {
                    badge.style.background = 'linear-gradient(135deg, #f59e0b, #ea580c)';
                    badge.style.color = '#ffffff';
                    badge.textContent = '✦ First Discovery!';
                } else {
                    badge.style.background = '#3b82f6';
                    badge.style.color = '#ffffff';
                    badge.textContent = '✨ New Discovery!';
                }
                el.appendChild(badge);
                setTimeout(() => badge.remove(), 2300);
            }

            canvasLayerEl.appendChild(el);

            // Position centered on (x, y) within workspace bounds
            const wsRect = workspaceEl.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const clampedX = Math.max(8, Math.min(wsRect.width - elRect.width - 8, x - elRect.width / 2));
            const clampedY = Math.max(8, Math.min(wsRect.height - elRect.height - 8, y - elRect.height / 2));

            el.style.left = `${clampedX}px`;
            el.style.top = `${clampedY}px`;

            const instanceObj = {
                id,
                name: item.name,
                emoji: item.emoji,
                el,
                isCombining: false
            };

            canvasInstances.push(instanceObj);
            updateEmptyHint();

            if (options.sparkles) {
                createSparkles(x, y, options.discoveryBadge === 'First Discovery!' ? '#f59e0b' : '#3b82f6');
            }

            attachInstanceEvents(instanceObj);
            return instanceObj;
        }

        function removeCanvasInstance(id) {
            const idx = canvasInstances.findIndex(inst => inst.id === id);
            if (idx !== -1) {
                canvasInstances[idx].el.remove();
                canvasInstances.splice(idx, 1);
                updateEmptyHint();
            }
        }

        function attachInstanceEvents(instance) {
            const el = instance.el;

            // Double-click to duplicate (authentic Neal.fun mechanic)
            el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (instance.isCombining) return;
                const rect = el.getBoundingClientRect();
                const wsRect = workspaceEl.getBoundingClientRect();
                const centerX = rect.left - wsRect.left + rect.width / 2 + 18;
                const centerY = rect.top - wsRect.top + rect.height / 2 + 18;
                SoundFX.playPop(1.15);
                spawnCanvasInstance({ name: instance.name, emoji: instance.emoji }, centerX, centerY);
            });

            // Right-click to delete instance
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (instance.isCombining) return;
                SoundFX.playDelete();
                removeCanvasInstance(instance.id);
            });

            // Pointer drag to move & combine
            el.addEventListener('pointerdown', (e) => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                if (instance.isCombining) return;
                e.preventDefault();
                e.stopPropagation();
                startCanvasInstanceDrag(e, instance);
            });
        }

        /**
         * DRAGGING FROM SIDEBAR -> WORKSPACE
         */
        function startSidebarDrag(startEvent, item) {
            SoundFX.playPop(0.95);
            const wsRect = workspaceEl.getBoundingClientRect();
            const startX = startEvent.clientX - wsRect.left;
            const startY = startEvent.clientY - wsRect.top;

            // Create floating ghost pill
            const ghost = document.createElement('div');
            ghost.className = 'element-pill canvas-instance dragging';
            ghost.style.position = 'fixed';
            ghost.style.pointerEvents = 'none';
            ghost.style.zIndex = '10000';
            ghost.innerHTML = `<span class="text-base leading-none">${item.emoji}</span><span>${escapeHtml(item.name)}</span>`;
            document.body.appendChild(ghost);

            const updateGhostPos = (clientX, clientY) => {
                const r = ghost.getBoundingClientRect();
                ghost.style.left = `${clientX - r.width / 2}px`;
                ghost.style.top = `${clientY - r.height / 2}px`;
            };

            updateGhostPos(startEvent.clientX, startEvent.clientY);

            let moved = false;
            let hoveredTarget = null;

            const onPointerMove = (e) => {
                if (Math.hypot(e.clientX - startEvent.clientX, e.clientY - startEvent.clientY) > 5) {
                    moved = true;
                }
                updateGhostPos(e.clientX, e.clientY);

                const ghostRect = ghost.getBoundingClientRect();
                const target = findOverlapTarget(ghostRect, null);
                if (hoveredTarget && hoveredTarget !== target) {
                    hoveredTarget.el.classList.remove('drop-target');
                }
                hoveredTarget = target;
                if (hoveredTarget) {
                    hoveredTarget.el.classList.add('drop-target');
                }
            };

            const onPointerUp = (e) => {
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('pointercancel', onPointerUp);

                if (hoveredTarget) {
                    hoveredTarget.el.classList.remove('drop-target');
                }

                const curWsRect = workspaceEl.getBoundingClientRect();
                const inWorkspace = (
                    e.clientX >= curWsRect.left &&
                    e.clientX <= curWsRect.right &&
                    e.clientY >= curWsRect.top &&
                    e.clientY <= curWsRect.bottom
                );

                ghost.remove();

                if (!moved) {
                    // Quick click/tap in sidebar spawns near center with slight jitter
                    const randX = curWsRect.width * 0.5 + (Math.random() - 0.5) * 140;
                    const randY = curWsRect.height * 0.48 + (Math.random() - 0.5) * 140;
                    spawnCanvasInstance(item, randX, randY);
                    return;
                }

                if (inWorkspace) {
                    const dropX = e.clientX - curWsRect.left;
                    const dropY = e.clientY - curWsRect.top;

                    if (hoveredTarget) {
                        const spawned = spawnCanvasInstance(item, dropX, dropY);
                        combineInstances(spawned, hoveredTarget);
                    } else {
                        spawnCanvasInstance(item, dropX, dropY);
                    }
                }
            };

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointercancel', onPointerUp);
        }

        /**
         * DRAGGING EXISTING CANVAS INSTANCE
         */
        function startCanvasInstanceDrag(startEvent, instance) {
            const el = instance.el;
            el.classList.add('dragging');
            el.style.zIndex = ++topZIndex;
            SoundFX.playPop(1.05);

            const wsRect = workspaceEl.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const offsetX = startEvent.clientX - elRect.left;
            const offsetY = startEvent.clientY - elRect.top;

            let hoveredTarget = null;
            let overSidebar = false;

            const onPointerMove = (e) => {
                const newLeft = e.clientX - wsRect.left - offsetX;
                const newTop = e.clientY - wsRect.top - offsetY;
                el.style.left = `${newLeft}px`;
                el.style.top = `${newTop}px`;

                // Check if over sidebar (trash zone)
                const sbRect = sidebarEl.getBoundingClientRect();
                const isOverSb = (
                    e.clientX >= sbRect.left &&
                    e.clientX <= sbRect.right &&
                    e.clientY >= sbRect.top &&
                    e.clientY <= sbRect.bottom
                );

                if (isOverSb !== overSidebar) {
                    overSidebar = isOverSb;
                    sidebarEl.classList.toggle('delete-hover', overSidebar);
                    trashBannerEl.classList.toggle('hidden', !overSidebar);
                }

                if (overSidebar) {
                    if (hoveredTarget) {
                        hoveredTarget.el.classList.remove('drop-target');
                        hoveredTarget = null;
                    }
                    return;
                }

                // Check overlap with other canvas elements
                const curRect = el.getBoundingClientRect();
                const target = findOverlapTarget(curRect, instance.id);
                if (hoveredTarget && hoveredTarget !== target) {
                    hoveredTarget.el.classList.remove('drop-target');
                }
                hoveredTarget = target;
                if (hoveredTarget) {
                    hoveredTarget.el.classList.add('drop-target');
                }
            };

            const onPointerUp = (e) => {
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('pointercancel', onPointerUp);

                el.classList.remove('dragging');
                sidebarEl.classList.remove('delete-hover');
                trashBannerEl.classList.add('hidden');

                if (hoveredTarget) {
                    hoveredTarget.el.classList.remove('drop-target');
                }

                if (overSidebar) {
                    SoundFX.playDelete();
                    removeCanvasInstance(instance.id);
                    return;
                }

                // Clamp inside workspace boundaries if not combining
                const curWsRect = workspaceEl.getBoundingClientRect();
                const curElRect = el.getBoundingClientRect();
                const clampedX = Math.max(6, Math.min(curWsRect.width - curElRect.width - 6, parseFloat(el.style.left)));
                const clampedY = Math.max(6, Math.min(curWsRect.height - curElRect.height - 6, parseFloat(el.style.top)));
                el.style.left = `${clampedX}px`;
                el.style.top = `${clampedY}px`;

                if (hoveredTarget && !hoveredTarget.isCombining) {
                    combineInstances(instance, hoveredTarget);
                }
            };

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointercancel', onPointerUp);
        }

        /**
         * COLLISION / OVERLAP DETECTION
         */
        function findOverlapTarget(draggedRect, excludeId) {
            const dragCenterX = draggedRect.left + draggedRect.width / 2;
            const dragCenterY = draggedRect.top + draggedRect.height / 2;

            let bestTarget = null;
            let bestDist = Infinity;

            for (const candidate of canvasInstances) {
                if (candidate.id === excludeId || candidate.isCombining) continue;
                const r = candidate.el.getBoundingClientRect();

                // Generous bounding box intersection check
                const horizontalOverlap = Math.max(0, Math.min(draggedRect.right, r.right) - Math.max(draggedRect.left, r.left));
                const verticalOverlap = Math.max(0, Math.min(draggedRect.bottom, r.bottom) - Math.max(draggedRect.top, r.top));

                if (horizontalOverlap > 10 && verticalOverlap > 8) {
                    const cx = r.left + r.width / 2;
                    const cy = r.top + r.height / 2;
                    const dist = Math.hypot(dragCenterX - cx, dragCenterY - cy);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestTarget = candidate;
                    }
                }
            }
            return bestTarget;
        }

        /**
         * ELEMENT COMBINATION PIPELINE
         */
        async function combineInstances(instA, instB) {
            if (instA.isCombining || instB.isCombining) return;
            instA.isCombining = true;
            instB.isCombining = true;

            const wsRect = workspaceEl.getBoundingClientRect();
            const rectB = instB.el.getBoundingClientRect();
            const midX = rectB.left - wsRect.left + rectB.width / 2;
            const midY = rectB.top - wsRect.top + rectB.height / 2;

            const nameA = instA.name;
            const nameB = instB.name;

            // Remove original two instances immediately
            removeCanvasInstance(instA.id);
            removeCanvasInstance(instB.id);

            // Show subtle pulsing placeholder while resolving (especially noticeable during AI generation)
            const placeholder = document.createElement('div');
            placeholder.className = 'element-pill canvas-instance combining-placeholder';
            placeholder.innerHTML = `<span class="text-base leading-none">⏳</span><span class="opacity-75">Crafting...</span>`;
            canvasLayerEl.appendChild(placeholder);
            const pRect = placeholder.getBoundingClientRect();
            placeholder.style.left = `${Math.max(8, midX - pRect.width / 2)}px`;
            placeholder.style.top = `${Math.max(8, midY - pRect.height / 2)}px`;

            const result = await resolveRecipe(nameA, nameB);
            placeholder.remove();

            // Check if newly discovered
            const existing = discoveredItems.find(
                item => item.name.toLowerCase() === result.name.toLowerCase()
            );

            let badgeType = null;
            if (!existing) {
                const isFirstDiscovery = Boolean(result.isAI);
                discoveredItems.push({
                    name: result.name,
                    emoji: result.emoji,
                    discoveredAt: Date.now(),
                    isFirstDiscovery
                });
                saveState();
                updateCounter();
                renderSidebar(result.name);
                badgeType = isFirstDiscovery ? 'First Discovery!' : 'New Discovery!';
                SoundFX.playDiscovery(isFirstDiscovery);
            } else {
                SoundFX.playCombine();
            }

            spawnCanvasInstance(
                { name: result.name, emoji: result.emoji },
                midX,
                midY,
                {
                    discoveryBadge: badgeType,
                    sparkles: Boolean(badgeType)
                }
            );
        }

        /**
         * VISUAL POLISH: SPARKLE PARTICLES
         */
        function createSparkles(x, y, color) {
            const count = 10;
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'sparkle-dot';
                dot.style.backgroundColor = color;
                dot.style.left = `${x}px`;
                dot.style.top = `${y}px`;
                canvasLayerEl.appendChild(dot);

                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
                const velocity = 28 + Math.random() * 34;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                dot.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 520 + Math.random() * 200,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
                }).onfinish = () => dot.remove();
            }
        }

        /**
         * UI CONTROLS & EVENT LISTENERS
         */
        function applyTheme() {
            document.documentElement.classList.toggle('dark', darkMode);
            document.getElementById('icon-moon').classList.toggle('hidden', darkMode);
            document.getElementById('icon-sun').classList.toggle('hidden', !darkMode);
        }

        function updateSoundIcon() {
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
        }

        function updateSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                const isActive = btn.dataset.sort === sortMode;
                if (isActive) {
                    btn.style.backgroundColor = darkMode ? '#1e293b' : '#0f172a';
                    btn.style.color = '#ffffff';
                    btn.style.borderColor = darkMode ? '#334155' : '#0f172a';
                } else {
                    btn.style.backgroundColor = 'var(--pill-bg)';
                    btn.style.color = 'var(--ui-muted)';
                    btn.style.borderColor = 'var(--border-color)';
                }
            });
        }

        document.getElementById('btn-clear').addEventListener('click', () => {
            if (canvasInstances.length > 0) {
                SoundFX.playDelete();
                canvasInstances.forEach(inst => inst.el.remove());
                canvasInstances = [];
                updateEmptyHint();
            }
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            updateSoundIcon();
            saveState();
            if (soundEnabled) SoundFX.playPop(1.2);
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
            darkMode = !darkMode;
            applyTheme();
            updateSortButtons();
            saveState();
        });

        // Reset Progress Modal
        const resetModal = document.getElementById('reset-modal');
        document.getElementById('btn-reset').addEventListener('click', () => {
            resetModal.classList.remove('hidden');
        });
        document.getElementById('cancel-reset').addEventListener('click', () => {
            resetModal.classList.add('hidden');
        });
        document.getElementById('confirm-reset').addEventListener('click', () => {
            resetModal.classList.add('hidden');
            canvasInstances.forEach(inst => inst.el.remove());
            canvasInstances = [];
            discoveredItems = [...INITIAL_ELEMENTS];
            recipeCache = { ...SEED_RECIPES };
            searchQuery = '';
            searchInputEl.value = '';
            clearSearchBtn.classList.add('hidden');
            saveState();
            renderSidebar();
            updateCounter();
            updateEmptyHint();
            SoundFX.playDelete();
        });

        // Search input
        searchInputEl.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
            renderSidebar();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchQuery = '';
            searchInputEl.value = '';
            clearSearchBtn.classList.add('hidden');
            renderSidebar();
            searchInputEl.focus();
        });

        // Sort buttons
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sortMode = btn.dataset.sort;
                updateSortButtons();
                renderSidebar();
                saveState();
            });
        });

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', loadState);
    </script>
